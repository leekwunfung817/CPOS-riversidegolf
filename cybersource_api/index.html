async function formPost(url, formData, callback) {

    try 
	{
		// console.log('Point 1');
		const response = await fetch(url, {
		method: "POST",
		headers: {
			//如果formData数据为已组合好的用&分隔的字符串,需要设置Content-Type
			//如果formData是new FormData对象,不能设置Content-Type
			//'Content-Type':'application/x-www-form-urlencoded;charset=utf-8',
		},
		  body: formData
		});
		
		// console.log('Point 2');
		if (response.ok) 
		{
			// console.log(response);
			const res_text = await response.text();//原样文本
			// console.log(res_text);

			const res = JSON.parse(res_text);	//格式化成json对象
			// console.log(res);
		// console.log('Point 2.1');
			callback(res);
		}
		// console.log('Point 3');
    }
	catch (error) 
	{
        console.error('Error fetching HTML:', error);
        return null; // Or handle the error differently
    }
	
}


function search(type)

	else if(type == 1)

	}

	var url = 'search.php';

			// applicationInformation
		}
		// console.log(res_data._embedded.transactionSummaries);

		search_res.innerHTML = json_str
	
	});

}
